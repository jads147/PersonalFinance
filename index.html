<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Finance Tracker</h1>
        </header>

        <div class="summary-cards">
            <div class="card income">
                <h3>Einnahmen</h3>
                <p class="amount" id="totalIncome">€0.00</p>
            </div>
            <div class="card expense">
                <h3>Ausgaben</h3>
                <p class="amount" id="totalExpense">€0.00</p>
            </div>
            <div class="card balance">
                <h3>Bilanz</h3>
                <p class="amount" id="balance">€0.00</p>
            </div>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Neue Transaktion</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="description">Beschreibung</label>
                        <input type="text" id="description" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Betrag (€)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Typ</label>
                        <select id="type" required>
                            <option value="income">Einnahme</option>
                            <option value="expense">Ausgabe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category">Kategorie</label>
                        <select id="category" required>
                            <option value="Gehalt">Gehalt</option>
                            <option value="Einkäufe">Einkäufe</option>
                            <option value="Miete">Miete</option>
                            <option value="Transport">Transport</option>
                            <option value="Unterhaltung">Unterhaltung</option>
                            <option value="Sonstiges">Sonstiges</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Datum</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" class="btn-primary">Transaktion hinzufügen</button>
                </form>
            </div>

            <div class="transactions-section">
                <h2>Transaktionen</h2>
                <div class="filter-bar">
                    <select id="filterType">
                        <option value="all">Alle</option>
                        <option value="income">Einnahmen</option>
                        <option value="expense">Ausgaben</option>
                    </select>
                    <select id="filterCategory">
                        <option value="all">Alle Kategorien</option>
                    </select>
                </div>
                <div id="transactionsList" class="transactions-list"></div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
